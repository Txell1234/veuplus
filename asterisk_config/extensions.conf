[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
; Configuració VeuPlus
VEUPLUS_API_URL=http://localhost:8003
VEUPLUS_LANGUAGE=ca
VEUPLUS_VOICE_SYSTEM=catalan

[default]
; Trucada entrant - redirigir a VeuPlus
exten => _X.,1,NoOp(Trucada entrant: ${CALLERID(num)} -> ${EXTEN})
exten => _X.,n,Set(CALL_ID=${CALLERID(num)}_${EXTEN}_${EPOCH})
exten => _X.,n,Set(VEUPLUS_CALL_ID=${CALL_ID})
exten => _X.,n,Goto(veuplus-greeting,start,1)

[veuplus-greeting]
; Reproduir benvinguda de VeuPlus
exten => start,1,NoOp(Iniciant benvinguda VeuPlus)
exten => start,n,Set(GREETING_FILE=/tmp/veuplus_greeting_${VEUPLUS_CALL_ID}.wav)
exten => start,n,AGI(veuplus_greeting.agi,${CALLERID(num)},${EXTEN},${VEUPLUS_LANGUAGE},${VEUPLUS_VOICE_SYSTEM})
exten => start,n,Playback(${GREETING_FILE})
exten => start,n,Goto(veuplus-conversation,start,1)

[veuplus-conversation]
; Bucle de conversa amb VeuPlus
exten => start,1,NoOp(Iniciant conversa VeuPlus)
exten => start,n,Set(SILENCE_TIMEOUT=5)
exten => start,n,Set(MAX_SILENCE=10)

; Gravar entrada de veu
exten => start,n,Set(INPUT_FILE=/tmp/veuplus_input_${VEUPLUS_CALL_ID}.wav)
exten => start,n,Record(${INPUT_FILE}:wav,${SILENCE_TIMEOUT},${MAX_SILENCE})

; Processar amb VeuPlus
exten => start,n,AGI(veuplus_process.agi,${VEUPLUS_CALL_ID},${INPUT_FILE},${VEUPLUS_LANGUAGE},${VEUPLUS_VOICE_SYSTEM})

; Reproduir resposta
exten => start,n,Set(RESPONSE_FILE=/tmp/veuplus_response_${VEUPLUS_CALL_ID}.wav)
exten => start,n,Playback(${RESPONSE_FILE})

; Verificar si cal continuar
exten => start,n,Set(CONTINUE=${AGI(veuplus_continue.agi,${VEUPLUS_CALL_ID})})
exten => start,n,GotoIf($["${CONTINUE}" = "yes"]?start,1)

; Finalitzar trucada
exten => start,n,NoOp(Finalitzant trucada VeuPlus)
exten => start,n,Hangup()

[veuplus-error]
; Gestió d'errors
exten => _X.,1,NoOp(Error en VeuPlus: ${ARG1})
exten => _X.,n,Playback(veuplus-error)
exten => _X.,n,Hangup()

[internal]
; Extensions internes
exten => 100,1,Dial(SIP/100,20)
exten => 100,n,Voicemail(100,u)
exten => 100,n,Hangup()

exten => 101,1,Dial(SIP/101,20)
exten => 101,n,Voicemail(101,u)
exten => 101,n,Hangup()

[outbound]
; Trucades sortints
exten => _9NXXNXXXXXX,1,Dial(SIP/${EXTEN:1}@trunk)
exten => _9NXXNXXXXXX,n,Hangup()

exten => _911,1,Dial(SIP/911@emergency)
exten => _911,n,Hangup()










