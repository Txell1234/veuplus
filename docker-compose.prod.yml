version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - VEUPLUS_DB_PATH=/data/veuplus.db
      - TRANSFORMERS_PROVIDER=local
      - TRANSFORMERS_MODEL=distilgpt2
      - DISABLE_TRANSFORMERS_INIT=0
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1
      - DEVELOPMENT_MODE=false
      - RATE_LIMIT_GLOBAL_RPM=300
      - RATE_LIMIT_CHAT_RPM=30
      - RATE_LIMIT_TTS_RPM=60
      - RATE_LIMIT_ASR_RPM=60
    volumes:
      - ./data:/data
    expose:
      - "8001"
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  redis:
    image: redis:alpine
    command: ["redis-server","--appendonly","yes"]
    volumes:
      - ./data/redis:/data
    restart: unless-stopped

