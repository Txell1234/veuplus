name: VeuPlus CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Executar tests diaris a les 2:00 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  BACKEND_DIR: 'backend'
  FRONTEND_DIR: 'frontend'
  TESTS_DIR: 'tests'

jobs:
  # Job per verificar prerequisits i dependències
  prerequisites:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
        
    - name: Install Python dependencies
      run: |
        cd ${{ env.BACKEND_DIR }}
        pip install -r requirements.txt
        
    - name: Install Node.js dependencies
      run: |
        cd ${{ env.FRONTEND_DIR }}
        npm ci
        
    - name: Verify installations
      run: |
        python --version
        node --version
        npm --version
        pip list | head -10

  # Job per tests Python
  python-tests:
    runs-on: ubuntu-latest
    needs: prerequisites
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        cd ${{ env.BACKEND_DIR }}
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black
        
    - name: Lint Python code
      run: |
        cd ${{ env.BACKEND_DIR }}
        flake8 . --max-line-length=120 --ignore=E203,W503 --count --show-source --statistics
        black --check .
        
    - name: Run Python tests
      run: |
        cd ${{ env.TESTS_DIR }}
        python test_suite.py
        
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: python-test-results
        path: test_results_*.json

  # Job per tests Frontend
  frontend-tests:
    runs-on: ubuntu-latest
    needs: prerequisites
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
        
    - name: Install dependencies
      run: |
        cd ${{ env.FRONTEND_DIR }}
        npm ci
        
    - name: Lint JavaScript/TypeScript
      run: |
        cd ${{ env.FRONTEND_DIR }}
        npm run lint
        
    - name: Run Frontend tests
      run: |
        cd ${{ env.FRONTEND_DIR }}
        npm test -- --coverage --watchAll=false
        
    - name: Build Frontend
      run: |
        cd ${{ env.FRONTEND_DIR }}
        npm run build
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: frontend-build
        path: ${{ env.FRONTEND_DIR }}/dist

  # Job per tests d'integració
  integration-tests:
    runs-on: ubuntu-latest
    needs: [python-tests, frontend-tests]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veuplus_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Install dependencies
      run: |
        cd ${{ env.BACKEND_DIR }}
        pip install -r requirements.txt
        cd ../${{ env.FRONTEND_DIR }}
        npm ci
        
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: frontend-build
        path: ${{ env.FRONTEND_DIR }}/dist
        
    - name: Set up environment variables
      run: |
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/veuplus_test" >> $GITHUB_ENV
        echo "ENVIRONMENT=test" >> $GITHUB_ENV
        
    - name: Start services
      run: |
        docker-compose -f docker-compose.yml up -d
        
    - name: Wait for services
      run: |
        sleep 30
        curl -f http://localhost:8080/api/health || exit 1
        
    - name: Run integration tests
      run: |
        cd ${{ env.TESTS_DIR }}
        python test_suite.py
        
    - name: Stop services
      if: always()
      run: |
        docker-compose -f docker-compose.yml down

  # Job per construir imatges Docker
  docker-build:
    runs-on: ubuntu-latest
    needs: [python-tests, frontend-tests]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and push Docker images
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.production
        push: true
        tags: |
          veuplus/backend:latest
          veuplus/backend:${{ github.sha }}
          veuplus/frontend:latest
          veuplus/frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Job per deployment (només en main)
  deploy:
    runs-on: ubuntu-latest
    needs: [integration-tests, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to production
      run: |
        echo "Desplegant a producció..."
        # Aquí aniria la lògica de deployment específica
        # Per exemple, SSH a servidor, kubectl, etc.
        
    - name: Verify deployment
      run: |
        sleep 10
        curl -f https://veuplus.com/api/health || exit 1
        
    - name: Notify deployment
      run: |
        echo "✅ Deployment completat correctament!"

  # Job per generar report
  generate-report:
    runs-on: ubuntu-latest
    needs: [python-tests, frontend-tests, integration-tests]
    if: always()
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Generate CI/CD Report
      run: |
        cat > ci_report.md << EOF
        # VeuPlus CI/CD Report
        
        **Data:** $(date)
        **Commit:** ${{ github.sha }}
        **Branch:** ${{ github.ref_name }}
        
        ## Resultats dels Tests
        
        ### Tests Python
        - Status: ${{ needs.python-tests.result }}
        - Job: [python-tests](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
        
        ### Tests Frontend
        - Status: ${{ needs.frontend-tests.result }}
        - Job: [frontend-tests](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
        
        ### Tests d'Integració
        - Status: ${{ needs.integration-tests.result }}
        - Job: [integration-tests](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
        
        ## Resum
        - **Total Jobs:** 3
        - **Jobs Exitosos:** $(echo "${{ needs.python-tests.result }} ${{ needs.frontend-tests.result }} ${{ needs.integration-tests.result }}" | tr ' ' '\n' | grep -c 'success')
        - **Jobs Fallits:** $(echo "${{ needs.python-tests.result }} ${{ needs.frontend-tests.result }} ${{ needs.integration-tests.result }}" | tr ' ' '\n' | grep -c 'failure')
        
        EOF
        
    - name: Upload report
      uses: actions/upload-artifact@v3
      with:
        name: ci-report
        path: ci_report.md

  # Job per netejar recursos
  cleanup:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    steps:
    - name: Cleanup Docker images
      run: |
        docker system prune -f
        
    - name: Cleanup artifacts
      run: |
        echo "Neteja completada"



