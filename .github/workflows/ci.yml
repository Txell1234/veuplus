name: Backend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements-ci.txt ]; then pip install -r requirements-ci.txt; else pip install -r requirements.txt; fi

      - name: Pre-test diagnostics
        run: |
          python -V
          pip list
          ls -la
          echo "Workspace root:" $(pwd)
          echo "Collecting tests..."
          pytest --version
          pytest --collect-only -q || true

      - name: Run tests
        env:
          DISABLE_TRANSFORMERS_INIT: '1'
        run: |
          set -e
          pytest -q || (echo "::group::Verbose pytest output" && pytest -vv && echo "::endgroup::" && exit 1)

